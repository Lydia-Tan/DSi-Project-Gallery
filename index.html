<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio DS ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- BACKGROUND BUBBLES -->
<div class="bg-bubbles" id="bgBubbles"></div>

<div class="page">

  <header>
    <div class="site-title">Lydia's DS ✦</div>
    <div class="header-right">SELECT YOUR GAME ▶</div>
  </header>

  <main class="main">

    <!-- Project LIBRARY -->
    <section class="library-section">
      <div class="section-label">✦ Project Library</div>
      <div class="cartridge-grid" id="cartGrid"></div>
    </section>

    <!-- DS UNIT -->
    <div class="ds-stage" id="dsStage">
      <div class="ds-unit" id="dsUnit">

        <!-- ═══════════════════════════════════════════
             CLOSED STATE
             Shown by default; hidden when cartridge inserted.
             Accurate DS Lite closed form: a smooth, wide, pill-shaped
             slab. Hinge bump runs along the top edge. No screens,
             no buttons visible — just the clean back/lid surface.

             STICKERS go inside #dsClosedSlab below.
             Each .ds-sticker is absolutely positioned relative
             to that element (the slab face).

             STICKER SIZING GUIDE (slab is ~520px wide × ~155px tall):
               • Small  — 36px–54px wide/tall  → icons, stars, tiny decals
               • Medium — 56px–80px wide/tall  → most stickers, clusters
               • Large  — 82px–110px wide/tall → hero stickers
             Rectangular stickers can use mismatched width/height.
             Use PNG with transparency. Rotate with rotate(Ndeg).
             Stack with z-index (higher = on top). Some can bleed
             slightly outside the slab — the slab has overflow:visible.
        ═══════════════════════════════════════════ -->
        <div class="ds-closed" id="dsClosed">

          <!-- Hinge ridge along the top -->
          <div class="ds-closed-hinge-ridge">
            <div class="ds-closed-hinge-bump left"></div>
            <div class="ds-closed-hinge-bump right"></div>
          </div>

          <!-- The main slab face -->
          <div class="ds-closed-slab" id="dsClosedSlab">

            <!-- Gloss sweep -->
            <div class="ds-closed-gloss"></div>

            <!-- Embossed DS logo (two rounded rectangles, like the real device) -->
            <div class="ds-closed-logo">
              <div class="ds-logo-rect"></div>
              <div class="ds-logo-rect"></div>
            </div>

            <!-- Side detail: volume slider notch (left edge) -->
            <div class="ds-closed-side-detail left"></div>
            <!-- Side detail: cartridge slot hint (right edge) -->
            <div class="ds-closed-side-detail right"></div>

            <!--
            ═══════════════════════════════════
            ADD YOUR STICKERS HERE.
            Copy and paste a block below for each sticker.
            Adjust top/left/right/bottom, width, height, rotate, z-index.

            Example — small star sticker, top-left:
            <div class="ds-sticker" style="width:46px;height:46px;top:18px;left:38px;transform:rotate(-14deg);z-index:22;">
              <img src="stickers/star.png" alt="">
            </div>

            Example — medium sticker overlapping, shifted right:
            <div class="ds-sticker" style="width:70px;height:70px;top:30px;left:70px;transform:rotate(7deg);z-index:21;">
              <img src="stickers/flower.png" alt="">
            </div>

            Example — large sticker, lower-right corner:
            <div class="ds-sticker" style="width:96px;height:96px;bottom:10px;right:30px;transform:rotate(12deg);z-index:20;">
              <img src="stickers/butterfly.png" alt="">
            </div>
            ═══════════════════════════════════
            -->

          </div>

          <!-- Bottom edge strip (thicker lower lip of the clamshell) -->
          <div class="ds-closed-bottom-lip"></div>

        </div>
        <!-- /CLOSED STATE -->


        <!-- ═══════════════════════════════════════════
             OPEN STATE
             Hidden by default; shown when cartridge inserted.
             JS adds/removes the `visible` class.
        ═══════════════════════════════════════════ -->
        <div class="ds-open" id="dsOpen" style="display:none;">

          <!-- Shoulder buttons only visible when open -->
          <div class="shoulder-btn L"></div>
          <div class="shoulder-btn R"></div>

          <!-- TOP HALF -->
          <div class="ds-top">
            <div class="ds-camera"></div>
            <div class="power-led" id="powerLed"></div>

            <div class="ds-top-inner" style="position:relative;z-index:2;">
              <div class="top-screen">
                <div class="screen-off" id="screenOff">
                  <div class="screen-off-text">NO CARTRIDGE<br>INSERTED<br><br>▼ SELECT A GAME ▼</div>
                </div>
                <div class="boot-screen" id="bootScreen">
                  <div class="boot-logo">
                    <span id="bootTitle" style="font-size:1.2rem;">TITLE</span>
                    <span class="boot-sub" id="bootSub">LOADING...</span>
                  </div>
                  <div class="boot-bar-wrap">
                    <div class="boot-bar" id="bootBar"></div>
                  </div>
                </div>
                <div class="image-gallery" id="imageGallery">
                  <button class="gallery-arrow prev" id="galleryPrev">◀</button>
                  <button class="gallery-arrow next" id="galleryNext">▶</button>
                  <div class="gallery-nav" id="galleryDots"></div>
                </div>
                <div class="screen-reflection"></div>
                <div class="scanlines"></div>
              </div>
            </div>
          </div>

          <!-- HINGE -->
          <div class="ds-hinge">
            <div class="hinge-screw"></div>
            <div class="hinge-screw"></div>
          </div>

          <!-- BOTTOM HALF -->
          <div class="ds-bottom">

            <!-- Bottom screen -->
            <div class="bottom-screen-bezel">
              <div class="bottom-screen">
                <div class="bottom-idle" id="bottomIdle">
                  <div class="bottom-idle-text">
                    INSERT A CARTRIDGE<br>TO BEGIN ✦<br>
                    <span class="bottom-idle-blink">▼ ▼ ▼</span>
                  </div>
                </div>
                <div class="bottom-content" id="bottomContent">
                  <div class="bc-header" id="bcTitle">TITLE</div>
                  <span class="bc-tag" id="bcTag">TAG · YEAR</span>
                  <div class="bc-divider"></div>
                  <p class="bc-desc" id="bcDesc">Loading...</p>
                  <div class="bc-meta" id="bcMeta"></div>
                  <span class="bc-cursor"></span>
                </div>
                <div class="scanlines"></div>
              </div>
            </div>

            <!-- Controls -->
            <div class="ds-controls">
              <div class="dpad">
                <div class="dpad-h"></div>
                <div class="dpad-v"></div>
                <div class="dpad-center"></div>
              </div>
              <div class="ds-center">
                <div class="ss-buttons">
                  <div class="ss-btn"></div>
                  <div class="ss-btn"></div>
                </div>
                <div class="speaker-dots">
                  <div class="speaker-dot"></div><div class="speaker-dot"></div>
                  <div class="speaker-dot"></div><div class="speaker-dot"></div>
                  <div class="speaker-dot"></div><div class="speaker-dot"></div>
                  <div class="speaker-dot"></div><div class="speaker-dot"></div>
                </div>
              </div>
              <div class="abxy">
                <div class="game-btn btn-a">A</div>
                <div class="game-btn btn-b">B</div>
                <div class="game-btn btn-x">X</div>
                <div class="game-btn btn-y">Y</div>
              </div>
            </div>

            <!-- Cartridge slot -->
            <div class="ds-cart-slot">
              <div class="slot-cart-peek" id="slotPeek"></div>
            </div>

            <!-- Eject -->
            <button class="eject-btn" id="ejectBtn">⏏ Eject Cartridge</button>

            <div class="ds-logo-strip">PORTFOLIO DS™ · CREATIVE EDITION</div>
          </div>

        </div>
        <!-- /OPEN STATE -->

      </div>
    </div>
    <!-- /DS UNIT -->

    <p class="instructions" id="instructions">✦ Click a cartridge to see what I've made! ✦</p>

  </main>
</div>

<script src="scripts.js"></script>
</body>
</html>
